  <script>
  // Статическая версия держит фото рядом с собой. Перехватываем адреса
  // ещё до загрузки, чтобы картинки из сохранённых данных открывались.
  (function () {
    var toLocal = function (v) {
      if (typeof v !== 'string' || v.indexOf('/api/assets/') !== 0) return v;
      // на этой копии фотографии лежат в jpg, поэтому расширение приводим к нему
      var name = v.slice('/api/assets/'.length).replace(/[.](jpg|jpeg|png|webp)$/i, '');
      return './assets/' + name + '.jpg';
    };
    var desc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
    if (desc && desc.set) {
      Object.defineProperty(HTMLImageElement.prototype, 'src', {
        configurable: true,
        get: function () { return desc.get.call(this); },
        set: function (v) { desc.set.call(this, toLocal(v)); },
      });
    }
    var setAttr = Element.prototype.setAttribute;
    Element.prototype.setAttribute = function (name, value) {
      if (name === 'src' && this.tagName === 'IMG') value = toLocal(value);
      return setAttr.call(this, name, value);
    };
  })();

  // Простой режим: ?simple=1 убирает пузыри и тяжёлые эффекты.
  // Нужен на слабых устройствах, где эффекты рисуются чёрными пятнами.
  (function () {
    try {
      var q = String(location.search || '');
      var root = document.documentElement;
      if (q.indexOf('simple=1') > -1) {
        root.classList.add('babeo-simple');
        try { localStorage.setItem('babeo_simple_v1', '1'); } catch (e) {}
      } else if (q.indexOf('simple=0') > -1) {
        root.classList.remove('babeo-simple');
        try { localStorage.removeItem('babeo_simple_v1'); } catch (e) {}
      } else if (localStorage.getItem('babeo_simple_v1') === '1') {
        root.classList.add('babeo-simple');
      }
    } catch (e) {}
  })();
